spring.application.name=gapmap
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gapmap_local?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
app.jwt-secret=${JWT_SECRET:local-demo-change-this-secret-before-production-123456789}
app.cookie-secure=${COOKIE_SECURE:false}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.teacher-code=${TEACHER_INVITE_CODE:GAPMAP-TEACHER}
app.seed=${SEED_DATA:true}
app.seed-password=${SEED_PASSWORD:GapMap123!}
app.reset-token-minutes=${RESET_TOKEN_MINUTES:30}
app.reset-links-in-log=${RESET_LINKS_IN_LOG:false}
app.mastery.strong=80
app.mastery.developing=50
app.gaps.include-developing=true
server.error.include-message=never

spring.flyway.enabled=false
