spring.application.name=gapmap
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gapmap?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:gapmap}
spring.datasource.password=${DB_PASSWORD:gapmap_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
app.jwt-secret=${JWT_SECRET:}
app.cookie-secure=${COOKIE_SECURE:false}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.teacher-code=${TEACHER_INVITE_CODE:}
app.seed=${SEED_DATA:false}
app.seed-password=${SEED_PASSWORD:}
app.mastery.strong=80
app.mastery.developing=50
app.gaps.include-developing=true
server.error.include-message=never
