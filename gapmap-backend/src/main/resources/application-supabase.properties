# Activate explicitly; never combine with demo. Credentials have no fallback.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=gapmap
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.jpa.properties.hibernate.default_schema=gapmap
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.default-schema=gapmap
spring.flyway.schemas=gapmap
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
# Run remote migrations separately; runtime needs no migration credentials.
app.jwt-secret=${JWT_SECRET}
app.teacher-code=${TEACHER_INVITE_CODE}
app.frontend-origin=${FRONTEND_ORIGIN}
app.cookie-secure=true
app.seed=false
app.seed-password=unused-seeding-disabled
app.demo-login=false
app.reset-links-in-log=false
# Avoid inherited DEBUG exposing authentication request bodies.
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=INFO
