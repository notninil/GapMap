services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gapmap
      MYSQL_USER: gapmap
      MYSQL_PASSWORD: ${DB_PASSWORD:-gapmap_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gapmap_root_local}
    volumes:
      - gapmap_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./gapmap-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gapmap
      DB_USERNAME: gapmap
      DB_PASSWORD: ${DB_PASSWORD:-gapmap_local}
      JWT_SECRET: ${JWT_SECRET:-local-demo-change-this-secret-before-production-123456789}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:-GAPMAP-TEACHER}
      SEED_DATA: ${SEED_DATA:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-GapMap123!}
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./gapmap-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  gapmap_mysql:
